[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gps2asp"
version = "0.1.0"
description = "GPS-to-street resolver for NYC Alternate Side Parking"
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.7.0",
    "rtree>=1.4.0",
    "shapely>=2.1.0",
    "numpy",
    "httpx>=0.28.0",
    "zstandard>=0.21.0",
    "icalendar>=6.1.0",
]

[project.optional-dependencies]
build = [
    "geopandas>=1.1.0",
    "requests",
    "zstandard>=0.21.0",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gps2asp"]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*", "rtree", "rtree.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring network access to external APIs",
    "ha_integration: tests for Home Assistant custom integration",
]
