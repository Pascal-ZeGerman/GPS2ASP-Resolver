name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${GITHUB_REF_NAME}"
          if echo "$TAG" | grep -qE '\-(rc|alpha|beta)\.[0-9]+$'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ASP Parking ${{ github.ref_name }}

            A Home Assistant custom integration that resolves GPS coordinates to NYC
            Alternate Side Parking schedules and sends push notifications before
            cleaning windows.

            ## Install via HACS
            See README.md for setup instructions.

            ## What's changed
            See auto-generated notes below.
