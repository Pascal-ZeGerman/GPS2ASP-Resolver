name: pytest + lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  dependencies:
    name: Check dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify imports
        run: python -c "import gps2asp; import custom_components.asp_parking"

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest (skip network tests)
        run: python -m pytest tests/ -v --tb=short -m "not integration"

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install lint tools + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff mypy
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy (src/gps2asp)
        run: mypy src/gps2asp/
      - name: mypy (custom_components/asp_parking)
        run: mypy custom_components/asp_parking/
