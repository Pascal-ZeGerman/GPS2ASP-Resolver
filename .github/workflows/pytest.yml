name: pytest + lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  dependencies:
    name: Check dependencies
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install package + dev deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Verify imports
        run: .venv/bin/python -c "import gps2asp; import custom_components.asp_parking"

  test:
    name: pytest
    runs-on: self-hosted
    needs: dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install package + dev deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Run pytest (skip network tests)
        run: .venv/bin/python -m pytest tests/ -v --tb=short -m "not integration"

  lint:
    name: ruff + mypy
    runs-on: self-hosted
    needs: dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install lint tools + dev deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]" ruff mypy
      - name: ruff check
        run: .venv/bin/ruff check .
      - name: ruff format check
        run: .venv/bin/ruff format --check .
      - name: mypy (src/gps2asp)
        run: .venv/bin/mypy src/gps2asp/
      - name: mypy (custom_components/asp_parking)
        run: .venv/bin/mypy custom_components/asp_parking/
